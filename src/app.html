<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme & Appearance -->
		<meta name="theme-color" content="#eee8d8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="msapplication-TileColor" content="#eee8d8" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />

		<!-- Crawling & Indexing -->
		<meta
			name="robots"
			content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
		/>
		<meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />
		<meta name="bingbot" content="index, follow" />

		<!-- Author & Identity -->
		<meta name="author" content="Sajudin Ma'ruf" />
		<meta name="generator" content="SvelteKit" />

		<!-- Google Search Console Verification -->
		<meta name="google-site-verification" content="1VYd-dR-cElM2VIvOdO6rtOKy6ZSWrpc9oeFwOhG3Xs" />

		<!-- Favicon & Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.webp?v=2" type="image/webp" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/images/icon-192.png" />
		<link rel="sitemap" type="application/xml" href="/sitemap.xml" />

		<!-- PWA Manifest -->
		<link rel="manifest" href="/manifest.json" />

		<!-- Font Preconnects (performance) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
		/>

		<!-- DNS Prefetch for external resources -->
		<link rel="dns-prefetch" href="https://github.com" />
		<link rel="dns-prefetch" href="https://api.github.com" />
		<link rel="dns-prefetch" href="https://avatars.githubusercontent.com" />

		<!-- SvelteKit head injection -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
